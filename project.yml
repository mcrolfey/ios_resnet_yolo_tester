name: ResnetYoloTester
options:
  bundleIdPrefix: com.mcrolfey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  ResnetYoloTester:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ResnetYoloTester
    info:
      path: ResnetYoloTester/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "This app uses the camera to run real-time on-device object detection and classification benchmarks."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcrolfey.ResnetYoloTester
        PRODUCT_NAME: ResnetYoloTester
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
